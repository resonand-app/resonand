# Pre-commit runs the same checks as CI, so a commit that passes here passes there (INF-4).
#
# Install once per clone:
#
#     uvx pre-commit install
#
# The Python hooks are `local` and `system` rather than the usual mirror repositories. That is
# deliberate: mypy needs this project's own environment to resolve fastapi, sqlalchemy and
# pydantic, and a mirrored mypy in its own isolated virtualenv would either report hundreds of
# missing imports or need every dependency listed a second time and kept in step by hand. Running
# them through `uv run` means there is exactly one description of the toolchain -- backend/
# pyproject.toml -- and pre-commit, CI and a developer's terminal all use it.

default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.srt$|\.vtt$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        # No audio in the repository. Test fixtures are generated with ffmpeg at test time, which
        # is what keeps the clone small and the fixtures honest about what they contain.
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: no-internal-docs
        name: refuse to commit docs/internal
        # docs/internal/ is gitignored, but `git add -f` gets past that. The working
        # specification and the interface proposal stay local while the first version is being
        # built, and the repository going public later is exactly when this would bite.
        entry: docs/internal must not be committed -- it is deliberately local
        language: fail
        files: '^docs/internal/'

      - id: ruff-check
        name: ruff (lint)
        entry: uv run --project backend ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (strict)
        # Passes no filenames: mypy in strict mode over a package needs the whole package, and
        # checking one file at a time reports errors that do not exist and misses ones that do.
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: pytest
        # The fast subset. The ffmpeg-backed tests run in CI, where ffmpeg is installed as part
        # of the job rather than as part of somebody's laptop.
        entry: bash -c 'cd backend && uv run pytest -q -m "not slow"'
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  # --- The frontend --------------------------------------------------------
  #
  # The same four checks CI runs, in the same order, through the same npm scripts (INF-3d).
  # There is one description of each check -- frontend/package.json -- and pre-commit, CI and a
  # developer's terminal all use it, which is the arrangement the Python hooks above already
  # have through `uv run`.
  #
  # Each entry installs the toolchain if it is not there, because `uv run` does and a frontend
  # hook that failed on a fresh clone with "eslint: not found" would be the one thing that
  # teaches everybody to pass --no-verify. After the first run it costs a directory test.
  #
  # `pass_filenames: false` throughout, for the reason mypy above passes none: these tools are
  # configured by project, and handing them one file at a time reports problems that are not
  # there and misses ones that are.

      - id: frontend-lint
        name: eslint
        entry: bash -c 'cd frontend && { [ -d node_modules ] || npm ci --silent; } && npm run --silent lint'
        language: system
        files: '^frontend/'
        exclude: '^frontend/(dist|coverage|node_modules)/'
        pass_filenames: false
        require_serial: true

      - id: frontend-format
        name: prettier
        entry: bash -c 'cd frontend && { [ -d node_modules ] || npm ci --silent; } && npm run --silent format:check'
        language: system
        files: '^frontend/'
        exclude: '^frontend/(dist|coverage|node_modules)/'
        pass_filenames: false
        require_serial: true

      - id: frontend-typecheck
        name: tsc (strict)
        entry: bash -c 'cd frontend && { [ -d node_modules ] || npm ci --silent; } && npm run --silent typecheck'
        language: system
        files: '^frontend/'
        exclude: '^frontend/(dist|coverage|node_modules)/'
        pass_filenames: false
        require_serial: true

      - id: frontend-test
        name: vitest
        # No coverage here, and coverage in CI. The threshold is a property of the whole suite
        # and the fast loop is a property of the commit -- the same split as the backend's
        # `-m "not slow"` above.
        entry: bash -c 'cd frontend && { [ -d node_modules ] || npm ci --silent; } && npm run --silent test:unit'
        language: system
        files: '^frontend/'
        exclude: '^frontend/(dist|coverage|node_modules)/'
        pass_filenames: false
        require_serial: true
