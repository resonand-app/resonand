# The same checks as CI, so what passes here passes there (INF-4) -- split across two moments
# rather than run at one. Everything that reads the code runs on commit; the two suites that run
# it run on push.
#
# The split is about the amend, not about the clock. A correction to an open pull request amends
# its one commit, and with the suites on commit every amend paid for them again -- 52s of vitest
# or 92s of pytest to reword a sentence in a body. Nothing is skipped: a push is still gated, and
# it is still gated before anything reaches a branch anybody else can see.
#
# Install once per clone:
#
#     uvx pre-commit install
#
# That installs all three hook types named below. A clone that installed only pre-commit before
# this change must run it again, or the suites run nowhere locally.
#
# The Python hooks are `local` and `system` rather than the usual mirror repositories. That is
# deliberate: mypy needs this project's own environment to resolve fastapi, sqlalchemy and
# pydantic, and a mirrored mypy in its own isolated virtualenv would either report hundreds of
# missing imports or need every dependency listed a second time and kept in step by hand. Running
# them through `uv run` means there is exactly one description of the toolchain -- backend/
# pyproject.toml -- and pre-commit, CI and a developer's terminal all use it.

default_install_hook_types: [pre-commit, commit-msg, pre-push]
# Every hook is a commit hook unless it says otherwise, and the two that say otherwise say
# `pre-push`. Without this a hook with no stage runs at both, so a push would re-run the six
# checks the commit just passed over the same tree -- 34s to re-read code nothing has touched.
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.srt$|\.vtt$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        # No audio in the repository. Test fixtures are generated with ffmpeg at test time, which
        # is what keeps the clone small and the fixtures honest about what they contain.
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Provider-issued credentials, which `detect-private-key` misses because it only knows PEM
        # blocks. It will not catch a human-chosen password in prose -- no prefix, low entropy,
        # and measured against the one that reached this repository, which it passes. That class
        # is what the two refusals below are for.
        # No .gitleaks.toml: it passes clean here. If a fixture ever trips it, that file names the
        # rule and the path rather than excluding the suites, which is how a real finding gets
        # lost among the ignored ones.

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # A workflow as the runner will read it (INF-16): release.yml runs on a tag and nothing
        # else, so without this its first reader is the release.
        # Its shellcheck and pyflakes passes run only when their binary is on PATH, which a GitHub
        # runner has and a laptop may not -- off, so the hook says the same thing everywhere.
        args: [-shellcheck=, -pyflakes=]

  - repo: local
    hooks:
      - id: no-internal-docs
        name: refuse to commit docs/internal
        # docs/internal/ is gitignored, but `git add -f` gets past that. The working
        # specification and the interface proposal stay local while the first version is being
        # built, and the repository going public later is exactly when this would bite.
        entry: docs/internal must not be committed -- it is deliberately local
        language: fail
        files: '^docs/internal/'

      - id: no-agent-tooling
        name: refuse to commit agent tooling
        # Skills and agent definitions live in the devkit and are symlinked in, so nothing under
        # .claude/ is tracked and AGENTS.md is the whole of what a contributor needs. A skill is
        # written for one machine and says so -- paths, addresses, and once a working password.
        entry: .claude must not be committed -- agent tooling lives in the devkit
        language: fail
        files: '^\.claude/'

      - id: no-local-dev
        name: refuse to commit the local development layer
        # The parallel-agent layer is named in .git/info/exclude, which lives in the common git
        # directory: it is not committed, not pushed and not in any backup. Recloning or clearing
        # it silently re-arms `git add -A` over local-dev/state/, which holds every slot's archive
        # and the session signing key. This says the same thing somewhere that travels.
        entry: local-dev must not be committed -- it is this machine's development layer
        language: fail
        files: '^local-dev/'

      - id: ruff-check
        name: ruff (lint)
        entry: uv run --project backend ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (strict)
        # Passes no filenames: mypy in strict mode over a package needs the whole package, and
        # checking one file at a time reports errors that do not exist and misses ones that do.
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: pytest
        # The fast subset. The ffmpeg-backed tests run in CI, where ffmpeg is installed as part
        # of the job rather than as part of somebody's laptop.
        # On push rather than on commit: 92s, which is 91% of everything a backend commit pays.
        entry: bash -c 'cd backend && uv run pytest -q -m "not slow"'
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

  # --- The frontend --------------------------------------------------------
  #
  # The same four checks CI runs, in the same order, through the same npm scripts (INF-3d).
  # There is one description of each check -- frontend/package.json -- and pre-commit, CI and a
  # developer's terminal all use it, which is the arrangement the Python hooks above already
  # have through `uv run`.
  #
  # Each entry installs the toolchain if it is not there, because `uv run` does and a frontend
  # hook that failed on a fresh clone with "eslint: not found" would be the one thing that
  # teaches everybody to pass --no-verify. After the first run it costs a directory test.
  #
  # `pass_filenames: false` throughout, for the reason mypy above passes none: these tools are
  # configured by project, and handing them one file at a time reports problems that are not
  # there and misses ones that are.

      - id: frontend-lint
        name: eslint
        entry: bash -c 'cd frontend && { [ -d node_modules ] || npm ci --silent; } && npm run --silent lint'
        language: system
        files: '^frontend/'
        exclude: '^frontend/(dist|coverage|node_modules)/'
        pass_filenames: false
        require_serial: true

      - id: frontend-format
        name: prettier
        entry: bash -c 'cd frontend && { [ -d node_modules ] || npm ci --silent; } && npm run --silent format:check'
        language: system
        files: '^frontend/'
        exclude: '^frontend/(dist|coverage|node_modules)/'
        pass_filenames: false
        require_serial: true

      - id: frontend-typecheck
        name: tsc (strict)
        entry: bash -c 'cd frontend && { [ -d node_modules ] || npm ci --silent; } && npm run --silent typecheck'
        language: system
        files: '^frontend/'
        exclude: '^frontend/(dist|coverage|node_modules)/'
        pass_filenames: false
        require_serial: true

      - id: frontend-test
        name: vitest
        # No coverage here, and coverage in CI. The threshold is a property of the whole suite
        # and the fast loop is a property of the commit -- the same split as the backend's
        # `-m "not slow"` above.
        #
        # On push rather than on commit: 52s, which is 60% of everything a frontend commit pays.
        entry: bash -c 'cd frontend && { [ -d node_modules ] || npm ci --silent; } && npm run --silent test:unit'
        language: system
        files: '^frontend/'
        exclude: '^frontend/(dist|coverage|node_modules)/'
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
