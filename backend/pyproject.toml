[project]
name = "resonand"
version = "0.1.0"
description = "A self-hosted archive for the recordings that matter."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "sirwilliamdev" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "httpx>=0.28",
    "typer>=0.15",
    "structlog>=24.4",
    "pydantic>=2.9",
]

[project.scripts]
resonand = "resonand.cli.main:app"

[dependency-groups]
# httpx2 is only here for starlette's TestClient, which now wants it. The runtime HTTP
# client stays on httpx 0.28: the transcription provider is written against that API.
dev = [
    "httpx2>=2.12.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resonand"]

# --- Lint and format -------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["resonand", "tests"]

[tool.ruff.lint]
select = [
    "A",    # builtin shadowing
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "DTZ",  # naive datetimes -- DEC-11 depends on this one
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "PL",   # pylint
    "PTH",  # pathlib over os.path
    "RUF",  # ruff-specific
    "S",    # bandit
    "SIM",  # simplify
    "T20",  # no print()
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Row factories and fixtures legitimately take many keyword arguments, and a test that
# compares against a literal is clearer than one that compares against a named constant.
"tests/**" = ["ARG", "PLR0913", "PLR2004", "S101", "S105", "S106"]
"resonand/migrations/**" = ["E501", "INP001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
# A repository function that writes a row takes one keyword per column, and naming them is
# what makes the call site readable. Five is too few for that; a patch object is the answer
# past eight.
max-args = 8

# --- Types -----------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["resonand", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# The revision files are DDL scripts Alembic imports by path, not modules anything else
# imports. Type-checking them buys nothing and their duplicate basenames confuse the module
# resolver.
[[tool.mypy.overrides]]
module = ["resonand.migrations.*"]
ignore_errors = true

# --- Tests -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "ffmpeg: needs ffmpeg/ffprobe on PATH",
]

[tool.coverage.run]
branch = true
source = ["resonand"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
