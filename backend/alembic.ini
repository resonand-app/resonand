# Alembic's own configuration.
#
# The migration tree lives *inside* the package, at sonarium/migrations, so that it travels
# with the installed wheel. Deriving its location from the source tree worked from a checkout
# and left the container unable to find it, which is a failure that only shows up in a
# deployment.
#
# There is deliberately no `sqlalchemy.url` here: env.py reads it from
# sonarium.core.config, so `alembic upgrade head` run by hand and the automatic upgrade at
# startup (OPS-7) can never disagree about which file they are migrating.

[alembic]
script_location = sonarium/migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
