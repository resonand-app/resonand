# Resonand -- an example deployment (OPS-2).
#
# Copy deploy/.env.example to deploy/.env, edit it, and `docker compose up -d` from this
# directory. That file plus the named volume are the whole instance.
#
# Running it from a directory of its own is what this file is for, and it is not possible yet:
# until the first release (REL-5) there is no published image, and what builds one is the
# override beside this file. Copying this file out without it leaves a compose file naming an
# image that does not exist.
#
# Upgrading is `git pull && docker compose up -d --build` while it builds, and
# `docker compose pull && docker compose up -d` once there is something to pull. Either way the
# container migrates its own database at startup, under a lock (OPS-7). Read the upgrade section
# of deploy/README.md once before the first upgrade, because the two minutes it takes is the
# difference between a rollback and a restore.

name: resonand

services:
  resonand:
    # Nothing is published under this name yet, so pulling it fails. What runs instead is
    # docker-compose.override.yml, which sits beside this file, which compose loads without being
    # asked, and which builds the image out of the clone. This line starts being true at the first
    # release, and that is the same day the override stops being (REL-5).
    image: ghcr.io/resonand-app/resonand:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      # One volume for everything mutable: the database and the originals. This is what a backup
      # has to cover, and `resonand backup` covers only the database half of it -- see the
      # backup section of deploy/README.md.
      - resonand-data:/data
    ports:
      # Bound to localhost on purpose. Resonand speaks plain HTTP and expects a reverse proxy in
      # front of it for TLS; publishing this on 0.0.0.0 would serve session cookies in clear text
      # across your network. Remove the 127.0.0.1 only if you know why you are doing it.
      - "127.0.0.1:8000:8000"
    # The image's own healthcheck asks /readyz, which answers only once the database is reachable
    # and migrated. Repeated here so `docker compose ps` shows it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # ffmpeg is CPU-hungry and the worker will use everything you give it. Uncomment to keep a
    # transcode from making the rest of the machine unresponsive.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"

  # --- Transcription, on your own hardware ---------------------------------
  #
  # Uncomment to run faster-whisper behind an OpenAI-compatible API, which is the reference
  # deployment (DEC-18). On this path no audio ever leaves the machine.
  #
  # The image below is a third-party one and is named here as an example rather than as an
  # endorsement; any server that speaks POST /v1/audio/transcriptions with
  # response_format=verbose_json will do. Pin whatever you choose to a digest.
  #
  # whisper:
  #   image: fedirz/faster-whisper-server:latest-cpu
  #   restart: unless-stopped
  #   volumes:
  #     - whisper-models:/root/.cache/huggingface
  #   # A GPU makes this an order of magnitude faster. On CPU, expect a 40-minute interview to
  #   # take a while -- which is fine, because transcription is a background job and nothing
  #   # waits for it.
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - { driver: nvidia, count: 1, capabilities: [gpu] }

volumes:
  resonand-data:
  # whisper-models:
