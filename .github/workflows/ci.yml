# CI (INF-5). The same checks as .pre-commit-config.yaml, so they fail identically.
#
# Two check jobs and an image build. `backend` and `frontend` are deliberately not dependent on
# each other: they touch disjoint trees, and a Python failure that hides a TypeScript one costs
# a round trip to find out.
#
# Every action is pinned to a commit digest rather than to a tag. A tag is a pointer its owner can
# move, and these actions run with a token and a checkout of this repository -- so `@v4` is a
# standing agreement to execute whatever that pointer names on the morning it runs. The version
# beside each digest is what it resolved to when it was pinned, and it is a comment: the digest is
# what git checks out. Dependabot moves them, which is the other half of the arrangement and is
# configured in .github/dependabot.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow reads the repository and builds an image locally. It pushes
# nothing, so it needs nothing else.
permissions:
  contents: read

concurrency:
  # A second push to the same branch supersedes the first. Not for main, where every commit's
  # result is worth having on the record.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_FROZEN: "1"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ffmpeg
        # The media tests are marked `ffmpeg` and use the real binaries. Skipping them here would
        # mean the waveform, the transcode and the ffprobe parsing are only ever exercised on a
        # developer's machine -- which is where they already work.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        working-directory: backend
        run: uv sync --all-groups

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Check formatting
        working-directory: backend
        # `--check` rather than rewriting: CI reports, it does not edit.
        run: uv run ruff format --check .

      - name: Typecheck
        working-directory: backend
        run: uv run mypy

      - name: Test
        working-directory: backend
        run: uv run pytest -q --cov --cov-report=term-missing

      - name: Check the CLI is installed and runnable
        working-directory: backend
        # The console entry point is declared in pyproject and is how ING-11 and ING-13 are
        # actually used. A packaging mistake that breaks it would otherwise only show up in the
        # container.
        run: uv run resonand --help > /dev/null && uv run resonand version

      - name: The published document matches the committed snapshot
        working-directory: backend
        # UI-3a: the interface generates its typed client from `frontend/src/api/contract/openapi.json`,
        # so a change to any endpoint that lands without refreshing it leaves the interface
        # typed against an API that no longer exists. This is the half of the check the backend
        # owns; the frontend's own test holds the types to the snapshot.
        run: uv run resonand openapi --check

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The version `package.json` declares as its floor. Pinned to a major rather than to
          # `latest`, so a Node release does not change what CI checked overnight.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # `ci` and not `install`: it installs the lock file exactly and fails if package.json
        # has drifted from it, which is the frontend's `--frozen`.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        # `--check` rather than rewriting: CI reports, it does not edit.
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        # The bundle is what the image copies to /app/static, so a build that only ever happens
        # inside `docker build` is one that fails in the slowest possible place.
        run: npm run build

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: resonand:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it starts, migrates itself, becomes ready and serves the interface
        # The build only proves the image assembles. This proves the two things an operator
        # actually depends on: that a fresh container creates its own schema and reports itself
        # ready -- which is exactly what was broken when the migration tree was located relative
        # to the source tree rather than shipped inside the package -- and that the interface
        # the same image built is the one it serves.
        run: |
          docker run -d --name resonand-ci -p 8000:8000 \
            -e RESONAND_SECRET_KEY="$(openssl rand -hex 32)" \
            -e RESONAND_TRANSCRIPTION_BASE_URL=http://whisper.invalid/v1 \
            resonand:ci
          .github/scripts/wait-for-healthy.sh resonand-ci 30 || { docker rm -f resonand-ci > /dev/null; exit 1; }
          curl -fsS localhost:8000/readyz

          # The shell, asked for the way a browser asks for it. `#root` is what main.tsx mounts
          # into, so its absence means the bundle was not copied rather than that a page was
          # merely served -- which a 200 on its own would not distinguish.
          shell=$(curl -fsS -H 'Accept: text/html' localhost:8000/)
          echo "$shell" | grep -q 'id="root"' || {
            echo "the image served no application shell:"
            echo "$shell" | head -20
            docker rm -f resonand-ci > /dev/null
            exit 1
          }

          # The hashed bundle the shell points at, actually fetched. A shell referencing a
          # bundle that 404s is the failure this catches and the one a smoke test on `/` misses.
          bundle=$(echo "$shell" | grep -o '/assets/[^"]*\.js' | head -1)
          test -n "$bundle" || { echo "the shell references no bundle"; exit 1; }
          curl -fsS "localhost:8000${bundle}" > /dev/null
          echo "served the shell and ${bundle}"

          docker rm -f resonand-ci > /dev/null

      - name: Check a backup restores into a clean container
        # OPS-6. The restore was covered by a test that restored into a clean *database*, which
        # is the half of it this software controls. What an operator actually does is put a file
        # into a volume and start an image over it, and the two differ in everything the test
        # could not see: the volume, the uid the process runs as, and whether the instance comes
        # up at all afterwards.
        #
        # It follows `deploy/README.md`'s restore instructions step for step, so the procedure
        # somebody reads at four in the morning is the procedure that ran here.
        #
        # `fsck` is the assertion and not a flourish. It re-hashes every original and compares it
        # to what the database recorded, so a clean report is byte-level proof that both halves
        # of the backup came back and agree -- which a row count is not.
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"

          # --- An instance with an archive in it ---------------------------------------
          docker volume create resonand-live > /dev/null
          docker run -d --name resonand-live -v resonand-live:/data \
            -e RESONAND_SECRET_KEY="$secret" \
            -e RESONAND_TRANSCRIPTION_BASE_URL=http://whisper.invalid/v1 \
            resonand:ci > /dev/null
          .github/scripts/wait-for-healthy.sh resonand-live

          library=$(docker exec resonand-live resonand create-admin \
            --email operator@example.test --display-name Operator \
            --password "a-password-long-enough-to-accept" | sed -n 's/^Personal library: //p')
          test -n "$library" \
            || { echo "create-admin did not say which library to import into"; exit 1; }

          # Generated in the container rather than committed: audio never enters this repository,
          # and the image carries the ffmpeg that makes one.
          docker exec resonand-live ffmpeg -loglevel error \
            -f lavfi -i "sine=frequency=440:duration=3" /data/tmp/recording.flac
          docker exec resonand-live resonand import /data/tmp/recording.flac --library "$library"
          docker exec resonand-live resonand fsck --json

          # --- The backup, taken the way the instructions say to take it ----------------
          docker exec resonand-live resonand backup /data/backup.sqlite
          docker cp resonand-live:/data/backup.sqlite backup.sqlite
          # The originals are not in the backup, on purpose. This is the file-level copy the
          # note printed above tells the operator to take alongside it.
          docker cp resonand-live:/data/storage originals

          # Clean means clean. The volume goes with the container, so nothing below can pass by
          # reading what this instance left behind.
          docker rm -f resonand-live > /dev/null
          docker volume rm resonand-live > /dev/null

          # --- The restore, into a volume nothing has ever written ----------------------
          docker volume create resonand-restored > /dev/null
          docker create --name resonand-restored -v resonand-restored:/data \
            -e RESONAND_SECRET_KEY="$secret" \
            -e RESONAND_TRANSCRIPTION_BASE_URL=http://whisper.invalid/v1 \
            resonand:ci > /dev/null
          docker cp backup.sqlite resonand-restored:/data/resonand.db
          docker cp originals/. resonand-restored:/data/storage
          # Restored files carry the uid of whoever restored them, and the image runs as 10001.
          # Without this the instance exits on "attempt to write a readonly database" before it
          # serves anything, which is a restore that looks done and is not.
          docker run --rm -u 0 -v resonand-restored:/data resonand:ci chown -R 10001:10001 /data
          docker start resonand-restored > /dev/null
          .github/scripts/wait-for-healthy.sh resonand-restored

          # --- The step the instructions end on -----------------------------------------
          # `fsck` exits non-zero on any finding by itself; the count is the other half, because
          # an empty archive is clean and is not what was backed up.
          docker exec resonand-restored resonand fsck --json | tee report.json
          jq -e '.checked == 1' report.json > /dev/null \
            || { echo "the restored archive is not the archive that was backed up"; exit 1; }
          echo "the restored container holds the whole archive, originals included"

          docker rm -f resonand-restored > /dev/null
          docker volume rm resonand-restored > /dev/null

      - name: Check the CLI works inside the image
        run: docker run --rm resonand:ci resonand version
