<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sonarium</title>
    <meta name="description" content="A self-hosted archive for the recordings that matter." />
    <!--
      Dark is the default and light is a peer, so the browser is told before the bundle loads.
      `UI-1j` replaces this with the theme provider, which writes `data-theme` for an explicit
      choice and writes nothing at all when the choice is to follow the system.
    -->
    <meta name="color-scheme" content="dark light" />
    <!--
      Straight out of the design system rather than copied into a `public/` directory. Vite
      hashes and emits it like any other asset, and there is exactly one mark in the repository.
    -->
    <link rel="icon" type="image/svg+xml" href="./design-system/assets/sonarium-mark.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
