<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sonarium</title>
    <meta name="description" content="A self-hosted archive for the recordings that matter." />
    <!--
      Dark is the default and light is a peer, so the browser is told before the bundle loads.
      This stays after `UI-1j`: it is the answer for somebody who chose to follow the system,
      which is the choice that writes no attribute at all.
    -->
    <meta name="color-scheme" content="dark light" />
    <!--
      No flash of the wrong theme (`UI-1j`).

      Somebody who chose light would otherwise get a dark page for as long as it takes to fetch
      and run the bundle, which on a cold load is long enough to see. This puts the attribute on
      the document before the first paint; `ThemeProvider` reads the same key and finds the
      document already agreeing with it.

      The key is `sonarium-theme`, spelled here and in design-system/theme/theme.ts. This copy
      cannot import that one -- it has to run before any module does -- so a test asserts the two
      agree rather than trusting them to.
    -->
    <script>
      try {
        var choice = localStorage.getItem('sonarium-theme');
        if (choice === 'light' || choice === 'dark') {
          document.documentElement.setAttribute('data-theme', choice);
          document.documentElement.style.setProperty('color-scheme', choice);
        }
      } catch (error) {
        /* Blocked site data. The bundle will fall back to following the system. */
      }
    </script>
    <!--
      Browser and OS chrome, not the in-app mark. These come from the brand kit as rendered
      files -- an .ico for old browsers, sized PNGs for iOS/PWA/OS icon surfaces -- so they live
      in `public/` and are served at a fixed path instead of being hashed like a bundled asset.
      The in-app mark stays a single source in `design-system/assets/`, used by `Logo`.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />

    <meta property="og:title" content="Sonarium" />
    <meta
      property="og:description"
      content="A self-hosted archive for the recordings that matter."
    />
    <meta property="og:image" content="https://sonarium.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
