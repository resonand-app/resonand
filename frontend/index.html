<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      What every relative URL in this document resolves against (`OPS-4`).

      The bundle is built with a relative base, so the shell asks for `./assets/...` and
      `./favicon.ico`. Those would otherwise resolve against whatever route the browser is on --
      `/library/<uuid>` is a directory as far as a URL is concerned -- so the deployment root has
      to be stated rather than inferred. The API rewrites this one attribute from
      `RESONAND_BASE_PATH` as it serves the shell, which is why an instance on a subpath needs no
      second build. `/` is the value in development and on a subdomain, where nothing is rewritten.
    -->
    <base href="/" />
    <title>Resonand</title>
    <meta name="description" content="A self-hosted archive for the recordings that matter." />
    <!--
      Dark is the default and light is a peer, so the browser is told before the bundle loads.
      This stays after `UI-1j`: it is the answer for somebody who chose to follow the system,
      which is the choice that writes no attribute at all.
    -->
    <meta name="color-scheme" content="dark light" />
    <!--
      No flash of the wrong theme (`UI-1j`).

      Somebody who chose light would otherwise get a dark page for as long as it takes to fetch
      and run the bundle, which on a cold load is long enough to see. This puts the attribute on
      the document before the first paint; `ThemeProvider` reads the same key and finds the
      document already agreeing with it.

      The key is `resonand-theme`, spelled here and in design-system/theme/theme.ts. This copy
      cannot import that one -- it has to run before any module does -- so a test asserts the two
      agree rather than trusting them to.
    -->
    <script>
      try {
        var choice = localStorage.getItem('resonand-theme');
        if (choice === 'light' || choice === 'dark') {
          document.documentElement.setAttribute('data-theme', choice);
          document.documentElement.style.setProperty('color-scheme', choice);
        }
      } catch (error) {
        /* Blocked site data. The bundle will fall back to following the system. */
      }
    </script>
    <!--
      Browser and OS chrome, not the in-app mark. These come from the brand kit as rendered
      files -- an .ico for old browsers, sized PNGs for iOS/PWA/OS icon surfaces -- so they live
      in `public/` and are served at a fixed path instead of being hashed like a bundled asset.
      The in-app mark stays a single source in `design-system/assets/`, used by `Logo`.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!--
      The simplified mark, not the full one. The three arcs merge into a smudge below about 40px
      and a favicon is never drawn above 32, so the SVG slot -- which a modern browser prefers
      over the .ico -- gets the S on its own. The .ico carries both: simplified at 16 and 32, the
      full mark at 48. `favicon.svg` is still shipped for anywhere it is drawn large.
    -->
    <link rel="icon" href="/favicon-small.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      The browser chrome around an installed instance, which is `--surface` and not white
      (`UI-39`). Two of them, because a meta element can only select on the system preference:
      this is the answer for somebody following it, which is the same thing `semantic.css` does
      with a document carrying no `data-theme`. Somebody who chose the theme against their
      system keeps the chrome their system asked for -- the alternative is writing the value from
      the bundle, which repaints the chrome after first paint and is more noticeable than the
      mismatch it fixes.
    -->
    <meta name="theme-color" content="#12151C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />

    <meta property="og:title" content="Resonand" />
    <meta
      property="og:description"
      content="A self-hosted archive for the recordings that matter."
    />
    <meta property="og:image" content="https://resonand.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
