<!-- @startingPoint section="App" subtitle="The signed-in shell: nav, sidebar, landing, player" viewport="1340x820" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Sonarium — app UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { font-family: var(--font-sans); color: var(--text); overflow: hidden; }
  #root { position: absolute; inset: 0; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 5px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* The design-system bundle loads as a plain global script above. The kit's own screens are fetched
   and transformed here at runtime, so each screen stays one readable source file. */
(async function () {
  /* The compiled bundle only exists once the system has been indexed, so load it optionally. */
  await new Promise(resolve => {
    const s = document.createElement("script");
    s.src = "../../_ds_bundle.js";
    s.onload = resolve;
    s.onerror = () => resolve();
    document.head.appendChild(s);
  });
  const FILES = ["data.js", "Shell.jsx", "LandingScreen.jsx", "LibraryScreen.jsx",
                 "AudioDetailScreen.jsx", "LoginScreen.jsx", "App.jsx"];
  const fail = msg => {
    document.getElementById("root").innerHTML =
      '<div style="position:absolute;inset:0;display:grid;place-items:center;padding:40px;text-align:center">' +
      '<div style="max-width:480px"><div style="font-family:var(--font-display);font-weight:600;font-size:24px;color:var(--text)">' +
      'Kit failed to boot</div><div style="margin-top:10px;font-size:13.5px;line-height:1.6;color:var(--text-3)">' +
      msg + '</div></div></div>';
  };
  /* Components normally arrive via the compiled bundle above. Before the system has been indexed
     that file does not exist yet, so fall back to the component sources directly. */
  const COMPONENTS = [
    "Icon", "Logo", "Button", "IconButton", "TextField", "SearchField", "ColorSwatchPicker",
    "Waveform", "PlayerBar", "TranscriptLine", "StateBadge", "Chip", "LibraryCard",
    "CreateLibraryCard", "RecordingRow", "RecordingCard", "TopNav", "Sidebar", "ProfileMenu",
    "SearchResults", "Dialog"
  ];
  const GROUPS = {
    foundation: ["Icon", "Logo"],
    forms: ["Button", "IconButton", "TextField", "SearchField", "ColorSwatchPicker"],
    media: ["Waveform", "PlayerBar", "TranscriptLine"],
    data: ["StateBadge", "Chip", "LibraryCard", "CreateLibraryCard", "RecordingRow", "RecordingCard"],
    navigation: ["TopNav", "Sidebar", "ProfileMenu", "SearchResults", "Dialog"]
  };
  const bundlePresent = (() => {
    for (const k of Object.keys(window)) {
      let v; try { v = window[k]; } catch (e) { continue; }
      if (!v || typeof v !== "object" || v === window) continue;
      try { if (v.TopNav && v.Waveform && v.LibraryCard) return true; } catch (e) {}
    }
    return false;
  })();

  async function loadComponentSources() {
    let src = "";
    for (const [group, names] of Object.entries(GROUPS)) {
      for (const n of names) {
        const res = await fetch("../../components/" + group + "/" + n + ".jsx");
        if (!res.ok) throw new Error(n + ".jsx → " + res.status);
        src += (await res.text())
          .replace(/^import[^\n]*\n/gm, "")
          .replace(/^export \{[^}]*\};?\n/gm, "")
          .replace(/^export (function|const) /gm, "$1 ") + "\n";
      }
    }
    src += "window.SonariumComponents = { " + COMPONENTS.join(", ") + " };";
    const code = Babel.transform(src, { presets: [["react", { runtime: "classic" }]], filename: "components.jsx" }).code;
    new Function(code)();
  }

  try {
    if (!bundlePresent) await loadComponentSources();
    for (const f of FILES) {
      const res = await fetch(f);
      if (!res.ok) throw new Error(f + " → " + res.status);
      const code = Babel.transform(await res.text(), {
        presets: [["react", { runtime: "classic" }]],
        filename: f
      }).code;
      new Function(code)();
    }
    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(window.SonariumKit.App)
    );
  } catch (err) {
    console.error("Kit failed to boot:", err);
    fail(String(err && err.message ? err.message : err));
  }
})();
</script>
</body>
</html>
