<!-- @dsCard group="Components" viewport="700x420" name="Data — cards, rows, states" subtitle="Library card, create tile, recording card, dense rows, state badges" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
/* Components come from the compiled bundle once the system is indexed; before that exists, this
   falls back to the component sources so the card always renders. */
window.__dsReady = (async function () {
  await new Promise(resolve => {
    const s = document.createElement("script");
    s.src = "../../_ds_bundle.js";
    s.onload = resolve;
    s.onerror = () => resolve();
    document.head.appendChild(s);
  });
  const found = (() => {
    for (const k of Object.keys(window)) {
      let v; try { v = window[k]; } catch (e) { continue; }
      if (!v || typeof v !== "object" || v === window) continue;
      try { if (v.Waveform && v.Button && v.TopNav) return v; } catch (e) {}
    }
    return null;
  })();
  if (found) return found;
  const GROUPS = {"foundation":["Icon","Logo"],"forms":["Button","IconButton","TextField","SearchField","ColorSwatchPicker"],"media":["Waveform","PlayerBar","TranscriptLine"],"data":["StateBadge","Chip","LibraryCard","CreateLibraryCard","RecordingRow","RecordingCard"],"navigation":["TopNav","Sidebar","ProfileMenu","SearchResults","Dialog"]};
  let src = "";
  for (const [group, names] of Object.entries(GROUPS)) {
    for (const n of names) {
      const res = await fetch("../../components/" + group + "/" + n + ".jsx");
      src += (await res.text())
        .replace(/^import[^\n]*\n/gm, "")
        .replace(/^export \{[^}]*\};?\n/gm, "")
        .replace(/^export (function|const) /gm, "$1 ") + "\n";
    }
  }
  src += "window.SonariumComponents = { Icon, Logo, Button, IconButton, TextField, SearchField, ColorSwatchPicker, Waveform, PlayerBar, TranscriptLine, StateBadge, Chip, LibraryCard, CreateLibraryCard, RecordingRow, RecordingCard, TopNav, Sidebar, ProfileMenu, SearchResults, Dialog };";
  new Function(Babel.transform(src, { presets: [["react", { runtime: "classic" }]], filename: "components.jsx" }).code)();
  return window.SonariumComponents;
})();
</script>
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .wrap { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-4); padding:var(--space-4) var(--space-6); align-items:start; }
  .col { display:flex; flex-direction:column; gap:var(--space-3); }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
  .rows { background:var(--surface); border-radius:var(--radius-control); overflow:hidden; box-shadow:var(--elevation-raised); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/jsx" id="card-src">
  const { LibraryCard, CreateLibraryCard, RecordingCard, RecordingRow, StateBadge, Chip } = ds;
  ReactDOM.createRoot(document.getElementById("root")).render(
    <React.Fragment>
      <div className="wrap">
        <div className="col">
          <span className="lbl">Library card</span>
          <LibraryCard name="Àvia Teresa" meta="3 recordings · 2 h 04 min" colour="var(--library-clay)" seed={34} played={0.34} />
          <CreateLibraryCard />
        </div>
        <div className="col">
          <span className="lbl">Recording card</span>
          <RecordingCard name="The house on Carrer Nou" meta="48:12 · 12 Mar 2026" tags={["memòria","català"]} seed={21} played={0.28} />
          <span className="lbl">States</span>
          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
            <StateBadge state="none" /><StateBadge state="running" /><StateBadge state="done" /><StateBadge state="failed" />
          </div>
        </div>
        <div className="col">
          <span className="lbl">Dense rows · 36 px</span>
          <div className="rows">
            <RecordingRow name="The house on Carrer Nou" duration="48:12" state="done" seed={41} played={0.28} selected />
            <RecordingRow name="Sopar de Nadal 1998" duration="12:07" state="done" seed={42} />
            <RecordingRow name="Cançons que cantava la mare" duration="31:55" state="running" seed={43} />
            <RecordingRow name="Nota de veu 12 mar" duration="01:48" state="none" pending />
          </div>
          <span className="lbl">Chips</span>
          <div style={{ display:"flex", gap:6 }}><Chip active>Recent</Chip><Chip>Name</Chip><Chip>Size</Chip></div>
        </div>
      </div>
    </React.Fragment>
  );
</script>
<script>
/* Babel's inline transform defaults to the automatic JSX runtime, which emits an ES import and
   cannot run in a classic script — so transform the card source explicitly. */
window.__dsReady.then(ds => {
  const src = document.getElementById("card-src").textContent;
  const code = Babel.transform(src, { presets: [["react", { runtime: "classic" }]], filename: "card.jsx" }).code;
  new Function("ds", code)(ds);
});
</script>
</body>
</html>
