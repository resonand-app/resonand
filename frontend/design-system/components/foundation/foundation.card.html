<!-- @dsCard group="Components" viewport="700x150" name="Foundation — logo & icons" subtitle="The mark, the lockup, and the Lucide glyph set" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
/* Components come from the compiled bundle once the system is indexed; before that exists, this
   falls back to the component sources so the card always renders. */
window.__dsReady = (async function () {
  await new Promise(resolve => {
    const s = document.createElement("script");
    s.src = "../../_ds_bundle.js";
    s.onload = resolve;
    s.onerror = () => resolve();
    document.head.appendChild(s);
  });
  const found = (() => {
    for (const k of Object.keys(window)) {
      let v; try { v = window[k]; } catch (e) { continue; }
      if (!v || typeof v !== "object" || v === window) continue;
      try { if (v.Waveform && v.Button && v.TopNav) return v; } catch (e) {}
    }
    return null;
  })();
  if (found) return found;
  const GROUPS = {"foundation":["Icon","Logo"],"forms":["Button","IconButton","TextField","SearchField","ColorSwatchPicker"],"media":["Waveform","PlayerBar","TranscriptLine"],"data":["StateBadge","Chip","LibraryCard","CreateLibraryCard","RecordingRow","RecordingCard"],"navigation":["TopNav","Sidebar","ProfileMenu","SearchResults","Dialog"]};
  let src = "";
  for (const [group, names] of Object.entries(GROUPS)) {
    for (const n of names) {
      const res = await fetch("../../components/" + group + "/" + n + ".jsx");
      src += (await res.text())
        .replace(/^import[^\n]*\n/gm, "")
        .replace(/^export \{[^}]*\};?\n/gm, "")
        .replace(/^export (function|const) /gm, "$1 ") + "\n";
    }
  }
  src += "window.SonariumComponents = { Icon, Logo, Button, IconButton, TextField, SearchField, ColorSwatchPicker, Waveform, PlayerBar, TranscriptLine, StateBadge, Chip, LibraryCard, CreateLibraryCard, RecordingRow, RecordingCard, TopNav, Sidebar, ProfileMenu, SearchResults, Dialog };";
  new Function(Babel.transform(src, { presets: [["react", { runtime: "classic" }]], filename: "components.jsx" }).code)();
  return window.SonariumComponents;
})();
</script>
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .wrap { display:flex; align-items:center; gap:var(--space-8); padding:var(--space-4) var(--space-6); }
  .col { display:flex; flex-direction:column; gap:var(--space-3); }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
  .tile { width:38px; height:38px; border-radius:var(--radius-control); background:var(--accent-soft); display:grid; place-items:center; }
  .glyphs { display:flex; gap:var(--space-2); }
  .glyph { width:34px; height:34px; border-radius:var(--radius-control); background:var(--surface-2);
           display:grid; place-items:center; color:var(--text-2); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/jsx" id="card-src">
  const { Logo, Icon } = ds;
  const names = ["search","upload","panel-left","library","plus","play","pause","skip-back","skip-forward","share-2","more-vertical","trash-2","sliders-horizontal","moon","log-out","tag"];
  ReactDOM.createRoot(document.getElementById("root")).render(
    <div className="wrap">
      <div className="col">
        <span className="lbl">Lockup</span>
        <Logo size={26} />
        <div style={{ display:"flex", gap:8 }}>
          <span className="tile"><Logo size={21} showWordmark={false} /></span>
          <span className="tile" style={{ background:"var(--accent)" }}><Logo size={21} showWordmark={false} color="var(--accent-on)" /></span>
        </div>
      </div>
      <div className="col">
        <span className="lbl">Icons · Lucide · 1.7px stroke</span>
        <div className="glyphs">{names.slice(0,8).map(n => <span key={n} className="glyph"><Icon name={n} /></span>)}</div>
        <div className="glyphs">{names.slice(8).map(n => <span key={n} className="glyph"><Icon name={n} /></span>)}</div>
      </div>
    </div>
  );
</script>
<script>
/* Babel's inline transform defaults to the automatic JSX runtime, which emits an ES import and
   cannot run in a classic script — so transform the card source explicitly. */
window.__dsReady.then(ds => {
  const src = document.getElementById("card-src").textContent;
  const code = Babel.transform(src, { presets: [["react", { runtime: "classic" }]], filename: "card.jsx" }).code;
  new Function("ds", code)(ds);
});
</script>
</body>
</html>
