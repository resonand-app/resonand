<!-- @dsCard group="Components" viewport="700x300" name="Forms — buttons & fields" subtitle="Buttons, icon buttons, text and search fields, colour picker" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
/* Components come from the compiled bundle once the system is indexed; before that exists, this
   falls back to the component sources so the card always renders. */
window.__dsReady = (async function () {
  await new Promise(resolve => {
    const s = document.createElement("script");
    s.src = "../../_ds_bundle.js";
    s.onload = resolve;
    s.onerror = () => resolve();
    document.head.appendChild(s);
  });
  const found = (() => {
    for (const k of Object.keys(window)) {
      let v; try { v = window[k]; } catch (e) { continue; }
      if (!v || typeof v !== "object" || v === window) continue;
      try { if (v.Waveform && v.Button && v.TopNav) return v; } catch (e) {}
    }
    return null;
  })();
  if (found) return found;
  const GROUPS = {"foundation":["Icon","Logo"],"forms":["Button","IconButton","TextField","SearchField","ColorSwatchPicker"],"media":["Waveform","PlayerBar","TranscriptLine"],"data":["StateBadge","Chip","LibraryCard","CreateLibraryCard","RecordingRow","RecordingCard"],"navigation":["TopNav","Sidebar","ProfileMenu","SearchResults","Dialog"]};
  let src = "";
  for (const [group, names] of Object.entries(GROUPS)) {
    for (const n of names) {
      const res = await fetch("../../components/" + group + "/" + n + ".jsx");
      src += (await res.text())
        .replace(/^import[^\n]*\n/gm, "")
        .replace(/^export \{[^}]*\};?\n/gm, "")
        .replace(/^export (function|const) /gm, "$1 ") + "\n";
    }
  }
  src += "window.SonariumComponents = { Icon, Logo, Button, IconButton, TextField, SearchField, ColorSwatchPicker, Waveform, PlayerBar, TranscriptLine, StateBadge, Chip, LibraryCard, CreateLibraryCard, RecordingRow, RecordingCard, TopNav, Sidebar, ProfileMenu, SearchResults, Dialog };";
  new Function(Babel.transform(src, { presets: [["react", { runtime: "classic" }]], filename: "components.jsx" }).code)();
  return window.SonariumComponents;
})();
</script>
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .wrap { display:grid; grid-template-columns:1fr 300px; gap:var(--space-6); padding:var(--space-4) var(--space-6); }
  .col { display:flex; flex-direction:column; gap:var(--space-3); }
  .row { display:flex; flex-wrap:wrap; gap:var(--space-2); align-items:center; }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/jsx" id="card-src">
  const { Button, IconButton, TextField, SearchField, ColorSwatchPicker } = ds;
  ReactDOM.createRoot(document.getElementById("root")).render(
    <div className="wrap">
      <div className="col">
        <span className="lbl">Buttons</span>
        <div className="row">
          <Button variant="primary" icon="upload">Upload audio</Button>
          <Button variant="secondary" icon="share-2">Share</Button>
          <Button variant="ghost">Cancel</Button>
          <Button variant="danger" icon="trash-2">Delete</Button>
        </div>
        <div className="row">
          <Button variant="primary" disabled>Disabled</Button>
          <Button variant="primary" focused>Focused</Button>
          <IconButton icon="sliders-horizontal" label="Settings" />
          <IconButton icon="library" label="Libraries" active />
          <IconButton icon="more-vertical" variant="ghost" label="More" />
        </div>
        <span className="lbl" style={{ marginTop: 6 }}>Fields</span>
        <SearchField />
        <TextField value="Àvia Teresa" focused />
        <TextField value="Personal" error="You already have a library with this name." />
      </div>
      <div className="col">
        <span className="lbl">Library colour</span>
        <ColorSwatchPicker value="clay" label={null} size={26} />
        <span style={{ fontSize:12.5, lineHeight:1.5, color:"var(--text-3)" }}>
          Seven curated hues. The user picks one; nothing is derived from the audio or the name.
        </span>
      </div>
    </div>
  );
</script>
<script>
/* Babel's inline transform defaults to the automatic JSX runtime, which emits an ES import and
   cannot run in a classic script — so transform the card source explicitly. */
window.__dsReady.then(ds => {
  const src = document.getElementById("card-src").textContent;
  const code = Babel.transform(src, { presets: [["react", { runtime: "classic" }]], filename: "card.jsx" }).code;
  new Function("ds", code)(ds);
});
</script>
</body>
</html>
