<!-- @dsCard group="Colors" viewport="700x150" name="Library colours" subtitle="Seven muted hues the user picks from; each has a light-mode pair" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .pad { padding:var(--space-4) var(--space-6); }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
</style>
</head>
<body><div class="pad" style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;gap:10px">
      <div style="flex:1;display:flex;flex-direction:column;gap:4px">
          <div style="height:34px;border-radius:var(--radius-chip);background:#E8B45C"></div>
          <div style="height:18px;border-radius:5px;background:#B8811F"></div>
          <span class="mono" style="font-size:10.5px;color:var(--text-3)">amber</span>
        </div><div style="flex:1;display:flex;flex-direction:column;gap:4px">
          <div style="height:34px;border-radius:var(--radius-chip);background:#C97F5A"></div>
          <div style="height:18px;border-radius:5px;background:#A85F3C"></div>
          <span class="mono" style="font-size:10.5px;color:var(--text-3)">clay</span>
        </div><div style="flex:1;display:flex;flex-direction:column;gap:4px">
          <div style="height:34px;border-radius:var(--radius-chip);background:#6F8FB0"></div>
          <div style="height:18px;border-radius:5px;background:#4E6E90"></div>
          <span class="mono" style="font-size:10.5px;color:var(--text-3)">slate</span>
        </div><div style="flex:1;display:flex;flex-direction:column;gap:4px">
          <div style="height:34px;border-radius:var(--radius-chip);background:#7E9A6B"></div>
          <div style="height:18px;border-radius:5px;background:#5C7A49"></div>
          <span class="mono" style="font-size:10.5px;color:var(--text-3)">moss</span>
        </div><div style="flex:1;display:flex;flex-direction:column;gap:4px">
          <div style="height:34px;border-radius:var(--radius-chip);background:#8A8F9C"></div>
          <div style="height:18px;border-radius:5px;background:#6A7080"></div>
          <span class="mono" style="font-size:10.5px;color:var(--text-3)">stone</span>
        </div><div style="flex:1;display:flex;flex-direction:column;gap:4px">
          <div style="height:34px;border-radius:var(--radius-chip);background:#9B7BA8"></div>
          <div style="height:18px;border-radius:5px;background:#7A5B87"></div>
          <span class="mono" style="font-size:10.5px;color:var(--text-3)">plum</span>
        </div><div style="flex:1;display:flex;flex-direction:column;gap:4px">
          <div style="height:34px;border-radius:var(--radius-chip);background:#5F9E96"></div>
          <div style="height:18px;border-radius:5px;background:#3F7E76"></div>
          <span class="mono" style="font-size:10.5px;color:var(--text-3)">teal</span>
        </div>
    </div>
    <span style="font-size:12px;color:var(--text-3)">A library&rsquo;s colour identifies it in the sidebar and on its card. It never carries meaning on its own.</span>
  </div></body>
</html>
