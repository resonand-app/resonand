<!-- @dsCard group="Brand" viewport="700x200" name="Voice" subtitle="Plain, concrete, second person. It says what happened and what it costs." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .pad { padding:var(--space-4) var(--space-6); }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
</style>
</head>
<body><div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="lbl">Say</span>
      <span style="font-size:12.5px;line-height:1.45;color:var(--text-2)">Search everything you&rsquo;ve recorded</span><span style="font-size:12.5px;line-height:1.45;color:var(--text-2)">Name it and pick a colour</span><span style="font-size:12.5px;line-height:1.45;color:var(--text-2)">You already have a library with this name.</span><span style="font-size:12.5px;line-height:1.45;color:var(--text-2)">No waveform yet</span><span style="font-size:12.5px;line-height:1.45;color:var(--text-2)">Deleting this library also deletes its 84 recordings.</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="lbl">Never</span>
      <span style="font-size:12.5px;line-height:1.45;color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--state-failed)">Oops! Something went wrong</span><span style="font-size:12.5px;line-height:1.45;color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--state-failed)">Supercharge your audio workflow</span><span style="font-size:12.5px;line-height:1.45;color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--state-failed)">Unleash the power of transcription</span><span style="font-size:12.5px;line-height:1.45;color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--state-failed)">Are you sure?</span><span style="font-size:12.5px;line-height:1.45;color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--state-failed)">Processing&hellip;</span>
    </div>
  </div></body>
</html>
