<!-- @dsCard group="Spacing" viewport="700x160" name="Motion & focus" subtitle="120ms state, 200ms panels, one 2px accent focus ring" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .pad { padding:var(--space-4) var(--space-6); }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
</style>
</head>
<body><div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="lbl">Motion</span>
      <span style="font-size:12.5px;line-height:1.55;color:var(--text-3);text-wrap:pretty"><span class="mono" style="color:var(--text-2)">120ms</span> for state, <span class="mono" style="color:var(--text-2)">200ms</span> for panels, both ease-out. The transcript highlight is the only thing that moves on its own, and it stops under <span class="mono" style="color:var(--text-2)">prefers-reduced-motion</span>.</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="lbl">Focus</span>
      <div style="display:flex;gap:14px;align-items:center">
        <span style="height:34px;background:var(--accent);color:var(--accent-on);border-radius:var(--radius-pill);display:flex;align-items:center;padding:0 15px;font-size:13px;font-weight:600;outline:2px solid var(--accent);outline-offset:2px">Focused</span>
        <span style="height:36px;flex:1;background:var(--surface-2);border-radius:var(--radius-control);box-shadow:0 0 0 2px var(--accent);display:flex;align-items:center;padding:0 14px;font-size:13.5px;color:var(--text)">Field recordings</span>
      </div>
      <span style="font-size:12px;color:var(--text-3)">2px accent ring at 2px offset, on every interactive element.</span>
    </div>
  </div></body>
</html>
