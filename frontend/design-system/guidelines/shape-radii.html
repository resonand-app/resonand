<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="14 panels · 10 controls · 8 chips · pill buttons · circle avatars" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .pad { padding:var(--space-4) var(--space-6); }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
</style>
</head>
<body><div class="pad" style="display:flex;gap:12px;align-items:flex-end">
    <div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
        <div style="width:100%;height:52px;background:var(--surface-2);border-top:2px solid var(--accent);border-radius:var(--radius-chip)"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-2)">8</span>
        <span style="font-size:11px;color:var(--text-3);text-align:center">chips, colour swatch</span>
      </div><div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
        <div style="width:100%;height:52px;background:var(--surface-2);border-top:2px solid var(--accent);border-radius:var(--radius-control)"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-2)">10</span>
        <span style="font-size:11px;color:var(--text-3);text-align:center">inputs, menu items</span>
      </div><div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
        <div style="width:100%;height:52px;background:var(--surface-2);border-top:2px solid var(--accent);border-radius:var(--radius-panel)"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-2)">14</span>
        <span style="font-size:11px;color:var(--text-3);text-align:center">panels, cards</span>
      </div><div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
        <div style="width:100%;height:52px;background:var(--surface-2);border-top:2px solid var(--accent);border-radius:var(--radius-pill)"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-2)">pill</span>
        <span style="font-size:11px;color:var(--text-3);text-align:center">buttons, search</span>
      </div><div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
        <div style="width:100%;height:52px;background:var(--surface-2);border-top:2px solid var(--accent);border-radius:50%"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-2)">circle</span>
        <span style="font-size:11px;color:var(--text-3);text-align:center">avatars, play</span>
      </div>
  </div></body>
</html>
