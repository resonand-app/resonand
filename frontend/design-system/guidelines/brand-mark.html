<!-- @dsCard group="Brand" viewport="700x160" name="The mark" subtitle="Three radiating arcs curling into the Sonarium S" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .pad { padding:var(--space-4) var(--space-6); }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
</style>
</head>
<body><div class="pad" style="display:flex;align-items:center;gap:var(--space-8)">
    <div style="display:flex;align-items:baseline;padding:14px 16px;background:var(--surface);border-radius:var(--radius-panel);box-shadow:var(--elevation-panel)">
      <!-- The asset is padded for the tile treatments; here that padding is the lead, so no gap. -->
      <img src="../assets/sonarium-mark.svg" width="28" height="28" style="margin-bottom:-2px" alt="">
      <span style="font-family:var(--font-display);font-weight:600;font-size:23px;line-height:1;color:var(--text)">onarium</span>
    </div>
    <div style="display:flex;gap:8px">
      <span style="width:38px;height:38px;border-radius:var(--radius-control);background:var(--accent-soft);display:grid;place-items:center"><img src="../assets/sonarium-mark.svg" width="21" height="21" alt=""></span>
      <span style="width:38px;height:38px;border-radius:var(--radius-control);background:var(--accent);display:grid;place-items:center"><img src="../assets/sonarium-mark-dark-fg.svg" width="21" height="21" alt=""></span>
      <img src="../assets/sonarium-mark-tile.svg" width="38" height="38" alt="">
    </div>
    <span style="flex:1;font-size:12px;line-height:1.5;color:var(--text-3);max-width:220px;text-wrap:pretty">Three radiating arcs, like a signal or a sound wave, curling down into the letter S.</span>
  </div></body>
</html>
