<!-- @dsCard group="Type" viewport="700x200" name="Numeric — Geist Mono" subtitle="Anything comparable to another number is mono and tabular" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .pad { padding:var(--space-4) var(--space-6); }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
</style>
</head>
<body><div class="pad" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;flex-direction:column;gap:4px;">
        <span class="mono" style="font-weight:500;font-size:22px;letter-spacing:-.01em;color:var(--text)">48:12 · 1:12:40 · 04:37</span><span class="mono" style="font-size:11px;color:var(--text-3)">Geist Mono 500 · tabular · every duration and timestamp</span></div><div style="display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid var(--hairline)">
        <span class="mono" style="font-size:13px;color:var(--text-2)">537 recordings · 149 h 44 min · 84 · 1.25×</span><span class="mono" style="font-size:11px;color:var(--text-3)">Geist Mono 400 · 11–13px · counts, totals, speeds</span></div><div style="display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid var(--hairline)">
        <span class="lbl">Your libraries</span><span class="mono" style="font-size:11px;color:var(--text-3)">Geist Mono 500 · 10px · .12em · group labels, overlines</span></div>
  </div></body>
</html>
