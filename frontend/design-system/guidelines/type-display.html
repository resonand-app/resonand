<!-- @dsCard group="Type" viewport="700x180" name="Display — Chillax" subtitle="The wordmark and one page title per screen. Nothing else, ever." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .pad { padding:var(--space-4) var(--space-6); }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
</style>
</head>
<body><div class="pad" style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-family:var(--font-display);font-weight:600;font-size:36px;letter-spacing:-.02em;line-height:1.1;color:var(--text)">Libraries</span>
      <span class="mono" style="font-size:11px;color:var(--text-3)">Chillax 600 · 32–36px · --type-page-title-* · one per screen</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid var(--hairline)">
      <span style="display:flex;align-items:baseline">
        <span style="font-family:var(--font-display);font-weight:600;line-height:1;color:var(--text);font-size:24px">re</span>
        <img src="../assets/resonand-mark.svg" width="29" height="29" style="margin-bottom:-2px" alt="">
        <span style="font-family:var(--font-display);font-weight:600;line-height:1;color:var(--text);font-size:24px">onand</span>
      </span>
      <span class="mono" style="font-size:11px;color:var(--text-3)">Chillax 600 · --type-wordmark-* · the lockup, and nothing else</span>
    </div>
  </div></body>
</html>
