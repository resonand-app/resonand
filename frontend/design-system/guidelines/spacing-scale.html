<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base; six steps carry the whole interface" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .pad { padding:var(--space-4) var(--space-6); }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
</style>
</head>
<body><div class="pad" style="display:flex;align-items:flex-end;gap:10px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        <div style="width:34px;height:8px;background:var(--accent-soft);border-top:2px solid var(--accent);border-radius:2px"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-3)">4</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        <div style="width:34px;height:14px;background:var(--accent-soft);border-top:2px solid var(--accent);border-radius:2px"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-3)">8</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        <div style="width:34px;height:20px;background:var(--accent-soft);border-top:2px solid var(--accent);border-radius:2px"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-3)">12</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        <div style="width:34px;height:26px;background:var(--accent-soft);border-top:2px solid var(--accent);border-radius:2px"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-3)">16</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        <div style="width:34px;height:36px;background:var(--accent-soft);border-top:2px solid var(--accent);border-radius:2px"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-3)">24</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        <div style="width:34px;height:48px;background:var(--accent-soft);border-top:2px solid var(--accent);border-radius:2px"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-3)">32</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        <div style="width:34px;height:62px;background:var(--accent-soft);border-top:2px solid var(--accent);border-radius:2px"></div>
        <span class="mono" style="font-size:10.5px;color:var(--text-3)">48</span>
      </div>
    <span style="font-size:12px;line-height:1.5;color:var(--text-3);margin-left:12px;max-width:280px;text-wrap:pretty">Panel gap 12 · panel padding 16 · card grid gap 16 · page padding 28.</span>
  </div></body>
</html>
