<!-- @dsCard group="Colors" viewport="700x150" name="Transcription state" subtitle="Four states, each with a glyph and a word — colour is never the only signal" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .pad { padding:var(--space-4) var(--space-6); }
  .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .lbl { font-family:var(--font-mono); font-size:var(--type-overline-size); font-weight:var(--type-overline-weight);
         letter-spacing:var(--type-overline-tracking); text-transform:uppercase; color:var(--text-3); }
</style>
</head>
<body><div class="pad" style="display:flex;gap:10px">
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <div style="height:30px;background:var(--surface-2);border-radius:var(--radius-pill);display:flex;align-items:center;gap:7px;padding:0 12px">
          <span style="width:8px;height:8px;border-radius:50%;background:#8A8F9C"></span>
          <span style="font-size:12.5px;color:#8A8F9C">No transcript</span>
        </div>
        <span class="mono" style="font-size:10.5px;color:var(--text-3)">none · #8A8F9C</span>
      </div><div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <div style="height:30px;background:var(--surface-2);border-radius:var(--radius-pill);display:flex;align-items:center;gap:7px;padding:0 12px">
          <span style="width:8px;height:8px;border-radius:50%;background:#6F9ECC"></span>
          <span style="font-size:12.5px;color:#6F9ECC">In progress</span>
        </div>
        <span class="mono" style="font-size:10.5px;color:var(--text-3)">running · #6F9ECC</span>
      </div><div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <div style="height:30px;background:#0F2418;border-radius:var(--radius-pill);display:flex;align-items:center;gap:7px;padding:0 12px">
          <span style="width:8px;height:8px;border-radius:50%;background:#6FAE8B"></span>
          <span style="font-size:12.5px;color:#6FAE8B">Done</span>
        </div>
        <span class="mono" style="font-size:10.5px;color:var(--text-3)">done · #6FAE8B</span>
      </div><div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <div style="height:30px;background:#3A1512;border-radius:var(--radius-pill);display:flex;align-items:center;gap:7px;padding:0 12px">
          <span style="width:8px;height:8px;border-radius:50%;background:#D2705F"></span>
          <span style="font-size:12.5px;color:#D2705F">Failed</span>
        </div>
        <span class="mono" style="font-size:10.5px;color:var(--text-3)">failed · #D2705F</span>
      </div>
  </div></body>
</html>
